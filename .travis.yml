---
language: go

go:
  - 1.22.x

env:
  - GO111MODULE=on

services:
  - docker

before_script:
  - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8

script:
  - make lint
  - (cd v2 && make lint)
  - make ci

after_success:
  - bash <(curl -s https://codecov.io/bash)
